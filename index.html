const INDUSTRIES = ["全部","餐饮","零售电商","美业","美妆","服饰","母婴","教育","健身","门店","数码","旅游"];
const RANGES = [["30","30 天内"], ["90","90 天内"], ["365","一年内"], ["9999","全部"]];

/* ===================== 计算 ===================== */
const DAY = 86400000;
const today = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();

const NODES = DATES.map(([date, key]) => {
  const d = new Date(date + "T00:00:00");
  return { ...FEST[key], key, date, dateObj: d, days: Math.round((d - today) / DAY) };
}).filter((n) => n.days >= 0).sort((a, b) => a.days - b.days);

let IND = "全部", RANGE = "90", SEARCH = "", SEL = NODES[0] ? NODES[0].date + NODES[0].key : null;

/* ===================== 渲染 ===================== */
function cdClass(d) { return d === 0 ? "today" : d <= 7 ? "soon" : d <= 21 ? "near" : ""; }
function cdText(d) { return d === 0 ? "就是今天" : d + " 天后"; }
const fmtDate = (n) => `${n.dateObj.getFullYear()}年${n.dateObj.getMonth() + 1}月${n.dateObj.getDate()}日 周${"日一二三四五六"[n.dateObj.getDay()]}`;

function renderNext() {
  const n = NODES.find((x) => x.days >= 0);
  if (!n) { $("#next-hero").style.display = "none"; return; }
  const prep = n.days - n.lead;
  $("#next-hero").innerHTML = `
    <span class="next-emoji">${n.emoji}</span>
    <div style="flex:1;min-width:190px">
      <div class="tiny faint" style="letter-spacing:1.5px">下一个营销节点</div>
      <h2 style="margin:3px 0 5px">${n.name}</h2>
      <div class="small muted">${fmtDate(n)}　·　建议提前 ${n.lead} 天开始预热</div>
    </div>
    <div class="center">
      <div class="count-num">${n.days}</div>
      <div class="tiny faint">天后</div>
    </div>
    <div style="flex-basis:100%;max-width:560px" class="small muted">
      ${prep > 0
        ? `⏳ 距离<b style="color:var(--text)">建议开始筹备</b>的时间还有 <b style="color:var(--brand-2)">${prep}</b> 天，现在定方案刚刚好。`
        : `🔥 已进入预热期，<b style="color:#fda4af">今天就该发第一条内容了</b>。`}
    </div>`;
}

function filtered() {
  const lim = +RANGE;
  return NODES.filter((n) =>
    n.days <= lim &&
    (IND === "全部" || n.fit.includes(IND)) &&
    (!SEARCH || n.name.includes(SEARCH) || n.type.includes(SEARCH)));
}

function renderList() {
  const list = filtered();
  $("#count-info").textContent = `共 ${list.length} 个节点`;
  $("#nodes").innerHTML = list.length ? list.map((n) => `
    <div class="node ${SEL === n.date + n.key ? "on" : ""}" data-id="${n.date + n.key}">
      <span class="cd ${cdClass(n.days)}">${cdText(n.days)}</span>
      <div class="node-top"><span class="node-emoji">${n.emoji}</span>
        <div><div class="node-name">${n.name}</div><div class="node-date">${n.date}</div></div></div>
      <div class="row-wrap gap-4" style="margin-top:11px">
        <span class="tag tag-brand">${n.type}</span>
        ${n.fit.slice(0, 3).map((f) => `<span class="tag">${f}</span>`).join("")}
      </div>
    </div>`).join("")
    : '<div class="empty" style="grid-column:1/-1"><div class="big">🔍</div>没有符合条件的节点，换个行业或时间范围试试</div>';

  $$(".node").forEach((el) => el.addEventListener("click", () => { SEL = el.dataset.id; renderList(); renderDetail(); }));
}

function renderDetail() {
  const n = filtered().find((x) => x.date + x.key === SEL) || filtered()[0];
  if (!n) { $("#detail").innerHTML = ""; return; }
  SEL = n.date + n.key;

  $("#detail").innerHTML = `
    <div class="card fade-in">
      <div class="card-head">
        <span style="font-size:26px">${n.emoji}</span>
        <div style="flex:1">
          <h3>${n.name} · 营销方案</h3>
          <div class="tiny faint">${fmtDate(n)}　·　${cdText(n.days)}　·　建议提前 ${n.lead} 天预热</div>
        </div>
        <span class="tag tag-brand">${n.type}</span>
      </div>

      <div class="callout callout-info" style="margin-bottom:18px">
        <span class="ico">🎯</span><span><b>为什么值得做：</b>${n.why}</span>
      </div>

      <div class="row-wrap gap-4" style="margin-bottom:20px">
        <span class="tiny faint" style="margin-right:4px">适合行业：</span>
        ${n.fit.map((f) => `<span class="tag">${f}</span>`).join("")}
      </div>

      <div class="section-title">💡 三个能直接抄的玩法</div>
      ${n.plays.map((p, i) => `<div class="play">
          <span class="play-n">${i + 1}</span>
          <div><b>${p.t}</b><p>${p.d}</p></div>
        </div>`).join("")}

      <div class="section-title" style="margin-top:22px">✍️ 现成文案（点右上角复制）</div>
      ${n.copy.map((t) => `<div class="copybox">${esc(t)}
        <button class="icon-btn mini" data-copy="${esc(t)}" title="复制">📋</button></div>`).join("")}

      <div class="section-title" style="margin-top:22px">🎨 海报标语 → 一键复制</div>
      ${n.posters.map((p) => `<div class="slogan">
          <div style="flex:1;min-width:190px">
            <b style="font-size:15px">${esc(p.title)}</b>
            <div class="small muted">${esc(p.sub)}</div>
          </div>
          ${p.price ? `<span class="tag tag-brand">${esc(p.price)} ${esc(p.unit || "")}</span>` : ""}
          <button class="btn btn-sm btn-primary" data-slogan="${esc(p.title + "\n" + p.sub + (p.price ? "\n" + p.price + (p.unit || "") : ""))}">📋 复制海报文案</button>
        </div>`).join("")}

      <div class="callout callout-ok" style="margin-top:18px">
        <span class="ico">🗓️</span>
        <span><b>倒排时间表：</b>
          D-${n.lead} 定方案与物料 →
          D-${Math.max(2, Math.round(n.lead * .6))} 私域开始预告 →
          D-${Math.max(1, Math.round(n.lead * .25))} 发海报 + 开放预订 →
          D-Day 当天承接 →
          D+1 晒单返图、沉淀老客。</span>
      </div>
    </div>`;

  $$("#detail [data-copy]").forEach((b) => b.addEventListener("click", () => copy(b.dataset.copy, "文案")));
  $$("#detail [data-slogan]").forEach((b) => b.addEventListener("click", () => copy(b.dataset.slogan, "海报文案")));
}

/* ===================== 交互 ===================== */
$("#f-ind").innerHTML = INDUSTRIES.map((i) => `<label class="chip ${i === "全部" ? "on" : ""}" data-v="${i}">${i}</label>`).join("");
$$("#f-ind .chip").forEach((c) => c.addEventListener("click", () => {
  IND = c.dataset.v;
  $$("#f-ind .chip").forEach((x) => x.classList.toggle("on", x === c));
  renderList(); renderDetail();
}));

$("#f-range").innerHTML = RANGES.map(([v, l]) => `<label class="chip ${v === "90" ? "on" : ""}" data-v="${v}">${l}</label>`).join("");
$$("#f-range .chip").forEach((c) => c.addEventListener("click", () => {
  RANGE = c.dataset.v;
  $$("#f-range .chip").forEach((x) => x.classList.toggle("on", x === c));
  renderList(); renderDetail();
}));

$("#f-search").addEventListener("input", (e) => { SEARCH = e.target.value.trim(); renderList(); renderDetail(); });

renderNext();
renderList();
renderDetail();
</script>
